<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alexis Blouin</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <link rel="stylesheet" href="../bulma-ext/accordion.css" />
    <link rel="stylesheet" href="../bulma-ext/carousel.css" />
    <link rel="stylesheet" href="main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script type="text/javascript" src="main.js" defer></script>
  </head>

  <body>
    <nav class="navbar" role="navigation" aria-label="main navigation">
      <div class="navbar-brand">
        <a
          role="button"
          class="navbar-burger"
          aria-label="menu"
          aria-expanded="false"
          data-target="navbarBasicExample"
        >
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </a>
      </div>

      <div id="navbarBasicExample" class="navbar-menu">
        <div class="navbar-start">
          <a
            data-i18n="header.about-me"
            class="navbar-item"
            href="#aboutMeSection"
          >
            About Me
          </a>
          <a
            data-i18n="header.my-work"
            class="navbar-item"
            href="#myProjectsSection"
          >
            My Work
          </a>
          <a
            data-i18n="header.my-offer"
            class="navbar-item"
            href="#myOfferSection"
          >
            My Offer
          </a>
          <a
            data-i18n="header.contact"
            class="navbar-item"
            href="#linksSection"
          >
            Contact Me
          </a>
        </div>

        <div class="navbar-end">
          <div class="navbar-item">
            <button onclick="setLanguage('en')">EN</button>
            <button onclick="setLanguage('fr')">FR</button>
          </div>
        </div>
      </div>
    </nav>

    <section class="hero is-link">
      <div class="hero-body">
        <p class="title has-text-centered">Alexis Blouin</p>
        <p class="subtitle has-text-centered">
          <i data-i18n="hero.sentence-1">Junior in title, </i>
          <i><strong data-i18n="hero.sentence-2">impactful</strong></i>
          <i data-i18n="hero.sentence-3"> by nature.</i>
        </p>
      </div>
    </section>

    <div class="container is-max-desktop">
      <hr class="my-5 has-background-grey-light" />

      <div id="introSection"></div>

      <hr class="my-5 has-background-grey-light" />

      <div id="aboutMeSection"></div>

      <hr class="my-5 has-background-grey-light" />

      <div id="myProjectsSection"></div>

      <hr class="my-5 has-background-grey-light" />

      <div id="myOfferSection"></div>

      <hr class="my-5 has-background-grey-light" />

      <div id="linksSection"></div>
    </div>
  </body>
</html>
